<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Segmentation des Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-5">
                            Segmentation Client <br>
                            <small class="text-muted">Unsupervised Learning</small>
                        </h3>

                        <form method="post" action="/prediction">
                            <div class="mb-3">
                                <label class="form-label">Âge</label>
                                <input type="number" name="age"
                                       class="form-control"
                                       placeholder="Ex. 30" min="1" max="100" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Revenu annuel (en milliers de dollars K$)</label>
                                <input type="number" name="revenu"
                                       class="form-control"
                                       placeholder="Ex. 60" min="0" step="any" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Dépense annuelle (score de 1 à 100)</label>
                                <input type="number" name="depense"
                                       class="form-control"
                                       placeholder="Ex. 75" min="1" max="100" step="any" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Analyser
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <p class="text-center mt-3 text-muted">
                    Projet de segmentation client - Machine Learning non supervisé
                </p>
            </div>
        </div>
    </div>
</body>
</html>
